<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>進行用ページ｜ダサいUIを作ろうワークショップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1b33;
    --navy-2: #172747;
    --navy-3: #22355e;
    --gold: #c9a45c;
    --gold-soft: #e8d3a2;
    --ink: #f3eee3;
    --muted: #a7b1c6;
    --danger: #ff8a7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--navy);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.7;
  }
  main { width: 100%; max-width: 420px; }
  .eyebrow { color: var(--gold); font-size: 14px; letter-spacing: .08em; margin: 0 0 8px; }
  h1 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 800; font-size: 28px; line-height: 1.3; margin: 0 0 12px; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  label { display: block; font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  input {
    width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 10px;
    background: var(--navy-2); border: 1px solid var(--navy-3); color: var(--ink);
    font: inherit; font-size: 18px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button {
    width: 100%; min-height: 52px; margin-top: 12px; border-radius: 10px;
    background: var(--gold); border: 1px solid var(--gold); color: var(--navy);
    font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 1.7em; margin: 12px 0 0; font-size: 14px; color: var(--danger); }
  .msg.is-info { color: var(--gold-soft); }
</style>
</head>
<body>

  </form>

</main>

<script>
  // 全体を () => { ... } で囲み、変数がページ全体の名前とぶつからないようにする（配布ページと同じ理由。
  // 復号したスライドも同じページの中で動くので、スライド側の変数ともぶつけないため）
  (() => {
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const form = document.getElementById("lock-form");
    const pass = document.getElementById("lock-pass");
    const openButton = document.getElementById("lock-open");
    const msg = document.getElementById("lock-msg");
    const KEY_STORE = "ugly-ui-slides-key";

    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const toB64 = (bytes) => btoa(String.fromCharCode(...bytes));
    const say = (text, info) => { msg.textContent = text; msg.classList.toggle("is-info", !!info); };

    if (!window.crypto || !window.crypto.subtle) {
      say("このブラウザでは開けません。https:// で始まるURLを、PCのChromeやSafariで開いてください。");
      openButton.disabled = true;
      return;
    }

    // パスワードから鍵を作る。暗号化するスクリプト（encrypt-slides.mjs）と同じ手順にそろえる
    async function deriveKey(password) {
      const text = password.normalize("NFKC").trim();
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(text), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", hash: "SHA-256", salt: fromB64(payload.salt), iterations: payload.iter }, base, 256);
      return new Uint8Array(bits);
    }

    // 鍵が違うと、ここで失敗する
    async function decrypt(rawKey) {
      const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(payload.iv) }, key, fromB64(payload.data));
      return new TextDecoder().decode(plain);
    }

    // 再読み込みのたびにパスワードを入れ直さなくて済むよう、鍵をこのタブにだけ覚えておく（タブを閉じると消える）
    const remembered = () => {
      try {
        const saved = JSON.parse(sessionStorage.getItem(KEY_STORE));
        return saved && saved.salt === payload.salt ? fromB64(saved.key) : null;
      } catch { return null; }
    };
    const remember = (rawKey) => {
      try { sessionStorage.setItem(KEY_STORE, JSON.stringify({ salt: payload.salt, key: toB64(rawKey) })); } catch {}
    };
    const forget = () => { try { sessionStorage.removeItem(KEY_STORE); } catch {} };

    // このページの中身を、復号したスライドに入れ替える（URLと「#番号」はそのまま残る）。
    // このページを読み込み終える前に入れ替えると、入力画面の後ろにスライドが継ぎ足されてしまうので、読み込みを待つ
    const loaded = new Promise((done) => {
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", done, { once: true });
      else done();
    });
    async function show(html) {
      await loaded;
      document.open();
      document.write(html);
      document.close();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!pass.value.trim()) return;
      openButton.disabled = true;
      say("確認しています…", true);
      try {
        const rawKey = await deriveKey(pass.value);
        const html = await decrypt(rawKey);
        remember(rawKey);
        await show(html);
      } catch {
        openButton.disabled = false;
        say("パスワードが違います。");
        pass.select();
      }
    });

    const saved = remembered();
    if (saved) {
      form.hidden = true;
      decrypt(saved).then(show).catch(() => { forget(); form.hidden = false; pass.focus(); });
    }
  })();
</script>
</body>
</html>
